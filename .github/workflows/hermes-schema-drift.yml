name: Hermes ACP Schema Drift

# Nightly check of hermes-codes' three-link provenance chain:
# hermes-agent@main's SDK pin → that PyPI version's schema ref → the zed
# ACP schema files at that ref, each diffed against our committed
# snapshots at `hermes-codes/tests/schemas/`. Drift opens (or updates) an
# issue so we know to re-snapshot + regenerate.

on:
  schedule:
    # 06:47 UTC — offset from the codex drift check and GitHub's :00/:30
    # scheduled-workflow flush.
    - cron: "47 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: diff snapshotted vs upstream chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run drift check
        id: check
        run: |
          set +e
          python3 scripts/check_hermes_schema_drift.py | tee /tmp/drift_report.md
          STATUS=${PIPESTATUS[0]}
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          case "$STATUS" in
            0) echo "result=no-drift"        >> "$GITHUB_OUTPUT" ;;
            1) echo "result=drift"           >> "$GITHUB_OUTPUT" ;;
            *) echo "result=fetch-failure"   >> "$GITHUB_OUTPUT" ;;
          esac
          exit 0  # don't fail the job on drift; we file an issue instead

      - name: Open or update drift issue
        if: steps.check.outputs.result == 'drift'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABEL="hermes-schema-drift"
          TITLE="hermes-codes: snapshotted ACP schema chain has drifted from upstream"
          BODY_FILE=/tmp/drift_report.md
          gh label create "$LABEL" \
            --color "B60205" \
            --description "Nightly check found drift in the hermes ACP schema provenance chain" \
            --force \
            || true
          EXISTING=$(gh issue list --state open --label "$LABEL" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Updating existing drift issue #$EXISTING"
            {
              echo "_Nightly drift re-check (run #${{ github.run_number }}, $(date -u +%Y-%m-%dT%H:%MZ)):_"
              echo
              cat "$BODY_FILE"
            } | gh issue comment "$EXISTING" --body-file -
          else
            echo "Opening new drift issue"
            gh issue create \
              --title "$TITLE" \
              --label "$LABEL" \
              --body-file "$BODY_FILE"
          fi

      - name: Report fetch failure (job summary only — don't open issue)
        if: steps.check.outputs.result == 'fetch-failure'
        run: |
          {
            echo "## Schema drift check skipped"
            echo
            echo "Could not fetch an upstream link in the provenance chain"
            echo "(network blip, rate limit, or upstream rename). Will retry"
            echo "on the next nightly run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: All clear (job summary only)
        if: steps.check.outputs.result == 'no-drift'
        run: |
          {
            echo "## ✅ No schema drift"
            echo
            echo "The full provenance chain (hermes-agent pin → python-sdk"
            echo "schema ref → zed schema files) matches our snapshots."
          } >> "$GITHUB_STEP_SUMMARY"

  regen-deterministic:
    name: committed bindings match codegen output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - name: Regenerate from committed snapshots
        # Committed bindings are rustfmt-normalized, so regen must be too
        # before the diff means anything.
        run: |
          python3 scripts/codegen_acp.py
          cargo fmt -p hermes-codes
      - name: Diff against committed bindings
        run: |
          if ! git diff --exit-code hermes-codes/src/protocol_generated/; then
            echo "::error::Generated bindings do not match scripts/codegen_acp.py + rustfmt output — regenerate and commit."
            exit 1
          fi
