[package]
name = "hermes-codes"
version = "0.20.0"
edition = "2021"
rust-version = "1.85"
authors = ["Matthew Goodman <d3a6d0cec0c16f3e@inboxnegative.com>"]
description = "Typed Rust SDK for the NousResearch Hermes agent: serde models of the Agent Client Protocol (ACP) as spoken by `hermes acp`, plus an async (Tokio) client for multi-turn Hermes sessions, permissions, and terminal/fs callbacks."
documentation = "https://docs.rs/hermes-codes"
homepage = "https://github.com/meawoppl/rust-code-agent-sdks"
repository = "https://github.com/meawoppl/rust-code-agent-sdks"
license = "Apache-2.0"
readme = "README.md"
keywords = ["hermes", "nous", "acp", "agent", "llm"]
categories = ["api-bindings", "asynchronous", "encoding", "parsing"]
exclude = [
    ".claude/",
    "*.sh",
]

[lints]
workspace = true

[dependencies]
log = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
which = { workspace = true, optional = true }

[dev-dependencies]
env_logger = { workspace = true }
jsonschema = { workspace = true }
tokio = { workspace = true }

[features]
default = ["types", "async-client"]
types = []
async-client = ["types", "dep:tokio", "dep:log", "dep:which"]
integration-tests = ["async-client"]

[[example]]
name = "schema_coverage"
# Pure types-only; validates the generated model against the schema snapshot.
